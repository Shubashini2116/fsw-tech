spring.application.name=taskflow-backend
server.port=${PORT:8080}

# Database Configuration (Environment variables with local fallback)
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/taskflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Environment variables with fallback)
app.jwt.secret=${JWT_SECRET:TaskFlowSuperSecureKeyThatIsAtLeast256BitsLongForHMACSHA256SecretKey!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
